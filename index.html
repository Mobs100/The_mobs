<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE MOBS® — The Other Side</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #080808;
    color: #f4f0e8;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

a {
    color: inherit;
    text-decoration: none;
}

/* HEADER */

header {
    height: 90px;
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo sup {
    font-size: 9px;
    position: relative;
    top: -10px;
}

nav {
    display: flex;
    gap: 35px;
}

nav a {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
}

nav a:hover {
    opacity: .55;
}

/* HERO */

.hero {
    min-height: calc(100vh - 90px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 6%;
}

.hero-box {
    width: min(100%, 900px);
    min-height: 490px;

    background:
        radial-gradient(
            circle at center,
            #171717 0%,
            #101010 55%,
            #0d0d0d 100%
        );

    border: 1px solid #151515;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.kicker {
    font-size: 10px;
    letter-spacing: 6px;
    font-weight: 700;
    color: #aaa;
    margin-bottom: 30px;
}

.mob-title {
    font-size: clamp(90px, 17vw, 180px);
    line-height: .75;
    font-weight: 900;
    letter-spacing: -10px;
    position: relative;
}

.mob-title sup {
    font-size: 24px;
    position: absolute;
    top: -5px;
    right: -25px;
    letter-spacing: 0;
}

.description {
    margin-top: 45px;
    max-width: 480px;
    font-size: 14px;
    line-height: 1.7;
    color: #aaa;
}

.description strong {
    display: block;
    color: #f4f0e8;
    margin-top: 5px;
}

/* BUTTONS */

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 30px;
}

.btn {
    min-width: 160px;
    padding: 15px 25px;
    border: 1px solid #777;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .5px;
    transition: .2s ease;
}

.btn.primary {
    background: #f4f0e8;
    color: #080808;
    border-color: #f4f0e8;
}

.btn:hover {
    transform: translateY(-2px);
}

/* BOTTOM */

.scroll {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    letter-spacing: 5px;
    color: #555;
}

/* MOBILE */

@media (max-width: 700px) {

    header {
        height: 70px;
        padding: 0 20px;
    }

    nav {
        gap: 15px;
    }

    nav a {
        font-size: 10px;
    }

    .hero {
        padding: 20px;
    }

    .hero-box {
        min-height: 550px;
    }

    .mob-title {
        font-size: 100px;
        letter-spacing: -7px;
    }

    .buttons {
        flex-direction: column;
        width: 80%;
    }

    .btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>

    <a href="./" class="logo">
        THE MOBS<sup>®</sup>
    </a>

    <nav>
        <a href="./">HOME</a>
        <a href="#about">ABOUT</a>
        <a href="#world">MOBS WORLD</a>
    </nav>

</header>


<main class="hero">

    <section class="hero-box">

        <div class="kicker">
            WELCOME TO THE OTHER SIDE
        </div>

        <div class="mob-title">
            MOB<sup>S</sup>
        </div>

        <div class="description">
            One place. Different sides.

            <strong>
                Food, people and a personality of its own.
            </strong>
        </div>

        <div class="buttons">

            <!-- CUSTOMER -->
            <a href="./customer/" class="btn primary">
                ENTER MOBS WORLD
            </a>

            <!-- CUSTOMER / FOOD -->
            <a href="./customer/" class="btn">
                DISCOVER MOBS
            </a>

        </div>

    </section>

</main>


<div class="scroll">
    SCROLL TO ENTER
</div>

</body>
</html>
