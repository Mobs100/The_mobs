function welcome(){return `<div class="page phone welcome">${face('peek')}<div><div class="muted" style="font-size:11px;letter-spacing:2px;font-weight:900">THE MOBS</div><h1>Hey<br>There.</h1><p>Good food for every background.</p><div class="stack"><button class="btn black full" onclick="nav('location')">ORDER NOW →</button><button class="btn white full" onclick="nav('menu')">BROWSE MENU</button></div></div><div class="muted" style="font-size:11px;text-align:center">Not the main character.<br>Still important to the story.</div></div>`}
function locationPage(){return `<div class="page phone">${top('Find Your Location')}<div class="box"><div class="pin">${I.pin}</div><h2>Let's Find<br>Your Location</h2><p class="muted">We need your location to show nearby branches and delivery time.</p><div class="stack"><button class="btn black full" onclick="useGeo()">ALLOW LOCATION</button><button class="btn white full" onclick="nav('home')">NOT NOW</button></div></div><div class="section"><div class="head"><h3>Or choose a branch</h3></div><div class="list">${['Dammam','Khobar','Al Khobar Corniche','Al Faisaliah'].map((x,i)=>`<button class="row" onclick="setLoc('${x}')"><span class="left">${I.pin}<b>${x}</b></span><span class="muted">${20+i*5}–${30+i*5} min</span></button>`).join('')}</div></div></div>`}
function home(){return `<div class="page">${top()}<div class="muted" style="font-size:11px;margin-top:2px">${I.pin} Deliver to <b>${esc(S.location||'Dammam')}</b></div><div style="margin-top:13px">${search()}</div><div class="chips" style="margin-top:12px">${[['🍔','Burgers','MAIN CHARACTERS'],['🍟','Sides','SIDE CHARACTERS'],['🥤','Drinks','SUPPORTING CHARACTERS'],['★',"MOB's Choice","MOB'S CHOICE"]].map(x=>`<button class="cat" onclick="setCat('${x[2]}')"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div><div class="hero"><div><small style="font-weight:900;letter-spacing:2px">MAIN CHARACTERS</small><h2>Not the main character.<br>Still a legend.</h2><div class="hand">Good food for every background.</div></div></div><div class="section"><div class="head"><h3>MAIN CHARACTERS</h3><a onclick="setCat('MAIN CHARACTERS')">SEE ALL →</a></div><div class="grid">${P.slice(0,4).map(card).join('')}</div></div><div class="section"><div class="head"><h3>SIDE CHARACTERS</h3><a onclick="setCat('SIDE CHARACTERS')">SEE ALL →</a></div><div class="grid">${P.filter(x=>x.cat==='SIDE CHARACTERS').map(card).join('')}</div></div>${bottom('home')}</div>`}
function menu(){let arr=P.filter(p=>(S.cat==='ALL'||p.cat===S.cat)&&`${p.name} ${p.cat}`.toLowerCase().includes(S.q.toLowerCase()));return `<div class="page">${top('Our Menu')}<div style="margin-top:8px">${search()}</div><div class="chips" style="margin-top:12px">${['ALL','MAIN CHARACTERS','SIDE CHARACTERS','SUPPORTING CHARACTERS',"MOB'S CHOICE"].map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="setCat('${c}')">${c.replace(' CHARACTERS','')}</button>`).join('')}</div><div class="section"><div class="head"><h3>${S.cat==='ALL'?'ALL CHARACTERS':S.cat}</h3></div><div class="grid">${arr.length?arr.map(card).join(''):state('No food here yet.','Try another category.')}</div></div>${bottom('menu')}</div>`}
function prod(){let p=S.selected;if(!p)return menu();let extra=S.extras.reduce((a,n)=>a+(p.extras.find(e=>e[0]===n)?.[1]||0),0);return `<div class="product"><div style="position:relative"><img src="${p.img}"><button class="circle" style="position:absolute;left:14px;top:14px" onclick="nav('menu')">${I.back}</button><button class="circle" style="position:absolute;right:14px;top:14px" onclick="toggleFav('${p.id}')">${I.heart}</button></div><div class="pbody"><small class="muted" style="font-weight:900;letter-spacing:1px">${p.cat}</small><h1>${p.name}</h1><b style="font-size:18px">${money(p.price)}</b><p class="muted" style="line-height:1.6;font-size:13px;margin-top:8px">${p.desc}</p>${p.extras.length?`<div class="extras"><h3>Add Extras</h3>${p.extras.map(e=>`<label class="extra"><span>${e[0]}</span><span>+${e[1]} SAR <input type="checkbox" ${S.extras.includes(e[0])?'checked':''} onchange="toggleExtra('${e[0]}')"></span></label>`).join('')}</div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:23px"><b>Quantity</b><div class="qty"><button onclick="S.qty=Math.max(1,S.qty-1);render()">−</button><b>${S.qty}</b><button onclick="S.qty++;render()">+</button></div></div></div><div class="sticky"><button class="btn yellow full" onclick="add('${p.id}',S.qty,S.extras)">ADD TO CART · ${money((p.price+extra)*S.qty)}</button></div></div>`}
function cart(){if(!S.cart.length)return `<div class="page phone">${top('Your Cart')}${state('Nothing here yet.','Even background characters need food.')} ${bottom('cart')}</div>`;return `<div class="page phone">${top('Your Cart')}<div class="cart" style="margin-top:14px">${S.cart.map(x=>`<div class="cartitem"><img src="${x.img}"><div><b style="font-size:12px">${x.name}</b><small class="muted" style="display:block;margin-top:4px">${x.extras.join(', ')||'Original'}</small><div class="qty" style="margin-top:7px"><button onclick="q('${esc(x.k)}',-1)">−</button><b>${x.qty}</b><button onclick="q('${esc(x.k)}',1)">+</button></div></div><b>${money(x.price*x.qty)}</b></div>`).join('')}</div><div class="summary"><div class="sum"><span>Subtotal</span><b>${money(sub())}</b></div><div class="sum"><span>Delivery Fee</span><b>${money(fee())}</b></div><div class="sum"><span>Tax (15%)</span><b>${money(tax())}</b></div><div class="sum total"><span>Total</span><b>${money(total())}</b></div></div><button class="btn black full" style="margin-top:14px" onclick="nav('checkout')">CHECKOUT →</button>${bottom('cart')}</div>`}
function checkout(){return `<div class="page phone">${top('Checkout')}<div class="section"><label class="label">DELIVERY ADDRESS</label><button class="row full" onclick="nav('location')"><span class="left">${I.pin}<span><b>${esc(S.location||'King Fahd Road, Dammam')}</b><small>Apt 12, Floor 3</small></span></span>CHANGE</button></div><div class="section"><label class="label">CONTACT INFORMATION</label><div class="stack"><input class="input" id="name" placeholder="Full name" value="${esc(localStorage.mobs_name||'')}"><input class="input" id="phone" placeholder="Phone number" value="${esc(localStorage.mobs_phone||'')}"></div></div><div class="section"><label class="label">PAYMENT METHOD</label><div class="payment">${['Cash on Delivery','Mada Card','Credit / Debit Card','Apple Pay'].map(x=>`<label class="pay"><input type="radio" name="pay" ${S.pay===x?'checked':''} onchange="S.pay='${x}'">${x}</label>`).join('')}</div></div><div class="section"><label class="label">ORDER NOTES (OPTIONAL)</label><textarea class="textarea" placeholder="Any special requests?"></textarea></div><div class="summary"><div class="sum"><span>Items</span><b>${count()}</b></div><div class="sum total"><span>Total</span><b>${money(total())}</b></div></div><button class="btn black full" style="margin-top:14px" onclick="place()">PLACE ORDER →</button></div>`}
function place(){let o={id:'MOBS-'+String(Date.now()).slice(-6),name:document.getElementById('name')?.value||'Guest',phone:document.getElementById('phone')?.value||'',location:S.location||'Dammam',items:S.cart.map(x=>({...x})),total:total(),status:'Preparing',created:new Date().toISOString()};localStorage.mobs_name=o.name;localStorage.mobs_phone=o.phone;S.orders.unshift(o);S.cart=[];save();S.current=o;nav('placed')}
function placed(){let o=S.current||S.orders[0];return `<div class="page phone success">${face('big')}<div class="hand" style="font-size:31px;margin-top:28px">You're in the story!</div><p class="muted">Your order has been placed successfully.</p><h2>#${o?.id||'MOBS-1024'}</h2><div class="eta"><span>Estimated arrival</span><b>20–30 min</b></div><div class="stack" style="width:100%"><button class="btn black full" onclick="nav('tracking')">TRACK ORDER</button><button class="btn white full" onclick="nav('home')">BACK TO HOME</button></div></div>`}
function tracking(){let o=S.current||S.orders[0];if(!o)return `<div class="page phone">${top('Track Order')}${state('No active order.','Place an order to see its story.')}</div>`;let sts=['Order received','Preparing your order','Out for delivery','Arrived at location','Delivered'],idx=o.status==='Preparing'?1:o.status==='Out for Delivery'?2:o.status==='Arrived'?3:4;return `<div class="page phone">${top('#'+o.id)}<div class="tracking"><small class="muted">YOUR ORDER</small><h2>#${o.id}</h2><div style="margin-top:22px">${sts.map((x,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'current':''}"><div class="dot">${i<idx?'✓':i===idx?'•':''}</div><div><b>${x}</b><small class="muted" style="display:block;margin-top:4px">${i<=idx?'Updated':'Waiting'}</small></div></div>`).join('')}</div>${idx<4?`<div class="eta"><span><b>Estimated arrival</b><small class="muted" style="display:block;margin-top:3px">Your order is on the way</small></span><b>${idx>=2?'10–15':'20–30'} min</b></div>`:''}${idx>=2&&idx<4?`<div class="driver"><span class="left"><span class="avatar">M</span><span><b>Mohammed</b><small class="muted" style="display:block">Your Driver</small></span></span><button class="circle" onclick="toast('Calling your driver…')">${I.phone}</button></div>`:''}</div><div class="hand" style="text-align:center;margin-top:20px;font-size:20px">Good Food for Every Background.</div>${bottom('orders')}</div>`}
function orders(){return `<div class="page phone">${top('My Orders')}${S.orders.length?`<div class="list" style="margin-top:15px">${S.orders.map(o=>`<button class="row" onclick="S.current=S.orders.find(x=>x.id==='${o.id}');nav('tracking')"><span class="left"><img style="width:48px;height:48px;border-radius:12px;object-fit:cover" src="${o.items[0]?.img||P[0].img}"><span><b>#${o.id}</b><small>${o.items.length} items · ${o.status}</small></span></span><b>${money(o.total)}</b></button>`).join('')}</div>`:state('No orders yet.','Good food is waiting for you.')} ${bottom('orders')}</div>`}
function notifications(){return `<div class="page phone">${top('Notifications')}<div class="list" style="margin-top:15px"><div class="notice"><div class="nicon">✓</div><div><b>Welcome to THE MOBS</b><p class="muted" style="font-size:11px">Different stories. Same good food.</p><small class="muted">Now</small></div></div></div>${bottom('more')}</div>`}
function more(){return `<div class="page phone">${top('More')}<div style="text-align:center;margin:30px 0">${face()}<h2 style="margin-top:12px">${esc(localStorage.mobs_name||'Background Character')}</h2><p class="muted">Part of the story.</p></div><div class="list"><button class="row" onclick="nav('orders')">My Orders <b>→</b></button><button class="row" onclick="nav('favorites')">Favorites <b>→</b></button><button class="row" onclick="nav('notifications')">Notifications <b>→</b></button><button class="row" onclick="nav('location')">Location & Branch <b>→</b></button></div><div class="hand" style="text-align:center;font-size:22px;margin-top:30px">Different Stories.<br>Same Good Food.</div>${bottom('more')}</div>`}
function favorites(){let a=P.filter(p=>S.fav.includes(p.id));return `<div class="page phone">${top('Favorites')}${a.length?`<div class="grid" style="margin-top:15px">${a.map(card).join('')}</div>`:state('Nothing saved yet.','Tap the heart on a product to keep it close.')} ${bottom('more')}</div>`}
function state(t,s){return `<div class="state">${face()}<h3>${t}</h3><p class="muted" style="font-size:12px">${s}</p><button class="btn black" style="min-height:43px" onclick="nav('menu')">BROWSE MENU</button></div>`}
function toggleFav(id){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id];save();toast(S.fav.includes(id)?'Saved to favorites.':'Removed from favorites.');render()}function toggleExtra(n){S.extras=S.extras.includes(n)?S.extras.filter(x=>x!==n):[...S.extras,n];render()}function setLoc(x){S.location=x;localStorage.mobs_location=x;toast('Location updated.');nav('home')}function useGeo(){if(!navigator.geolocation){toast('Location is not available.');return}navigator.geolocation.getCurrentPosition(()=>setLoc('Current location'),()=>toast('Location permission was not granted.'))}
function render(){let o={splash, welcome, location:locationPage,home,menu,product:prod,cart,checkout,placed,tracking,orders,notifications,more,favorites};document.getElementById('app').innerHTML=(o[S.route]||home)()}window.addEventListener('online',()=>toast("You're back online."));window.addEventListener('offline',()=>toast("You're offline."));render();
</script></body></html>
