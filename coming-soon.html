<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="THE MOBS — Coming Soon.">
<title>THE MOBS — Coming Soon</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  --black:#f3f3f1;
  --white:#111111;
  --yellow:#d9a900;
  --gray:#777;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  background:linear-gradient(
    var(--black),
    rgba(243,243,241,.9),
    transparent
  );
}

.nav{
  width:min(1400px,100%);
  margin:auto;
  padding:24px 34px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-family:"Archivo Black",Impact,sans-serif;
  font-size:22px;
  letter-spacing:-1.5px;
}

.logo sup{
  color:var(--yellow);
  font-size:.58em;
  vertical-align:top;
  margin-left:1px;
}

nav{
  display:flex;
  gap:34px;
}

nav a{
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
  transition:.2s;
}

nav a:hover{
  color:var(--yellow);
}

/* MAIN */

.coming-soon{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:120px 25px 100px;

  position:relative;
  overflow:hidden;
}

/* SUBTLE BACKGROUND */

.coming-soon::before{
  content:"";
  position:absolute;

  width:70vw;
  height:70vw;

  max-width:900px;
  max-height:900px;

  background:
    linear-gradient(
      135deg,
      transparent 49%,
      rgba(0,0,0,.025) 50%,
      transparent 51%
    ),
    linear-gradient(
      45deg,
      transparent 49%,
      rgba(0,0,0,.018) 50%,
      transparent 51%
    );

  pointer-events:none;
}

/* CONTENT */

.content{
  position:relative;
  z-index:2;

  max-width:850px;
  width:100%;
}

.kicker{
  color:var(--yellow);

  font-size:10px;
  font-weight:900;

  letter-spacing:.42em;

  text-transform:uppercase;

  margin-bottom:30px;
}

h1{
  font-family:"Archivo Black",Impact,sans-serif;

  font-size:clamp(75px,12vw,150px);

  line-height:.82;

  letter-spacing:-.07em;

  color:var(--white);

  margin-bottom:40px;
}

.description{
  max-width:600px;
  margin:0 auto;

  color:#777;

  font-size:14px;

  line-height:1.8;
}

/* BACK BUTTON */

.back{
  display:inline-block;

  margin-top:42px;

  font-size:10px;

  font-weight:900;

  letter-spacing:.14em;

  text-transform:uppercase;

  padding-bottom:8px;

  border-bottom:1px solid var(--white);

  transition:.2s;
}

.back:hover{
  color:var(--yellow);
  border-color:var(--yellow);
}

/* FOOTER */

footer{
  position:absolute;

  bottom:30px;
  left:0;
  right:0;

  padding:0 34px;

  display:flex;
  justify-content:space-between;

  color:#777;

  font-size:10px;

  letter-spacing:.12em;

  text-transform:uppercase;
}

footer strong{
  color:var(--white);
}

/* MOBILE */

@media(max-width:700px){

  .nav{
    padding:20px 18px;
  }

  nav{
    gap:18px;
  }

  nav a{
    font-size:10px;
  }

  .coming-soon{
    padding:100px 20px 100px;
  }

  h1{
    font-size:clamp(65px,18vw,110px);
  }

  .description{
    font-size:12px;
  }

  footer{
    padding:0 18px;

    flex-direction:column;
    gap:10px;

    text-align:center;
  }
}

@media(max-width:480px){

  nav{
    display:none;
  }

  .kicker{
    font-size:8px;
    letter-spacing:.3em;
  }

  h1{
    font-size:20vw;
  }
}
</style>
</head>

<body>

<header>

  <div class="nav">

    <a href="./index.html" class="logo">
      THE MOBS<sup>®</sup>
    </a>

    <nav>
      <a href="./index.html#home">Home</a>
      <a href="./index.html#about">About</a>
      <a href="./index.html#world">MOBS WORLD</a>
    </nav>

  </div>

</header>


<main>

  <section class="coming-soon">

    <div class="content">

      <div class="kicker">
        THE NEXT SIDE
      </div>

      <h1>
        COMING<br>
        SOON.
      </h1>

      <p class="description">
        This side of THE MOBS is still being built.
        The story continues soon.
      </p>

      <a href="./index.html#world" class="back">
        BACK TO MOBS WORLD
      </a>

    </div>

  </section>

</main>


<footer>

  <div>
    © 2026 <strong>THE MOBS</strong>
  </div>

  <div>
    MADE FOR THE MOBS
  </div>

</footer>


</body>
</html>
